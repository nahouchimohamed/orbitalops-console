name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test orbit-service
        working-directory: services/orbit-service
        run: go test ./...
      - name: Test planning-service
        working-directory: services/planning-service
        run: go test ./...
      - name: Test api-gateway
        working-directory: services/api-gateway
        run: go test ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f deploy/docker/Dockerfile.orbit -t orbital-orbit .
          docker build -f deploy/docker/Dockerfile.planning -t orbital-planning .
          docker build -f deploy/docker/Dockerfile.gateway -t orbital-gateway .
